<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Расходы</title>
<meta name="theme-color" content="#031b95">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Расходы">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css?v=10">
<style>
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.roleline{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.rolebox{display:flex;gap:8px}
.rolebox input{font:inherit;font-size:15px;padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--fg);min-width:0;flex:1}
.loading{opacity:.6;pointer-events:none}
.meline{margin:-6px 0 0;font-size:13px;color:var(--muted);padding-left:4px}
.sheetlink{color:var(--muted);font-size:13px}
.taxrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.taxrow select{font:inherit;font-size:15px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--fg)}
</style>
</head>
<body>
<div class="wrap">
  <header class="brand"><img src="logo.png" alt="Tradecom Korea"><span>Расходы команды</span></header>
  <div class="notice" id="notice" hidden></div>

  <form class="hero" id="form" novalidate>
    <div class="pair">
      <select class="pill" id="who" aria-label="Сотрудник"></select>
      <input class="pill" type="date" id="date" aria-label="Дата">
    </div>
    <div class="pin-row" id="pinRow" hidden>
      <input class="pill" type="password" id="pinIn" autocomplete="off" placeholder="Пароль" aria-label="Пароль">
      <button type="button" class="tubtn" id="pinGo">Войти</button>
    </div>
    <p class="msg err" id="pinErr" hidden></p>
    <p class="meline" id="meLine" hidden><span id="meName"></span> · <button type="button" class="linkbtn" id="meOut">Выйти</button></p>
    <label class="amt-cap" for="amount">Сумма расхода</label>
    <div class="amt-wrap">
      <input class="amt" id="amount" inputmode="numeric" autocomplete="off" placeholder="Введите сумму" aria-label="Сумма в вонах">
      <span class="amt-cur">₩</span>
    </div>
    <div class="cats" id="cats" role="group" aria-label="Категория"></div>
    <label class="amt-cap" for="place">Где потратили</label>
    <input class="note" id="place" maxlength="80" placeholder="Название места, например GS칼텍스" autocomplete="off">
    <label class="amt-cap" for="note">Комментарий</label>
    <input class="note" id="note" maxlength="120" placeholder="Например: поездка к клиенту" autocomplete="off">
    <button class="go" id="go" type="submit">Списать</button>
    <p class="msg" id="msg"></p>
  </form>

  <section style="display:flex;flex-direction:column;gap:10px">
    <div class="sumhead"><h2>К выдаче</h2><span class="sub" id="updated">загрузка…</span></div>
    <div class="people" id="sum"></div>
    <p class="msg" id="payMsg" hidden></p>
    <p class="sub" id="wkSub"></p>
  </section>

  <details class="box" id="hist">
    <summary>История расходов</summary>
    <div class="hfilt"><select id="hWho" aria-label="Сотрудник"></select></div>
    <div id="log"><div class="empty">Загрузка…</div></div>
  </details>

  <section class="tools" id="tools" hidden>
    <button type="button" class="dl" id="dlLedger">Скачать ведомость в Excel</button>
    <div class="taxrow"><button type="button" class="dl" id="dlTax">Отчёт для налоговой (현금 지출 현황)</button><select id="taxYear" aria-label="Год"></select></div>
    <a class="sheetlink" id="sheetLink" target="_blank" rel="noopener" hidden>Открыть Google Таблицу (сотрудники, бюджеты, пароли)</a>
    <p class="msg" id="lgMsg"></p>
  </section>

  <section class="roleline" id="roleLine">
    <button type="button" class="linkbtn" id="roleOpen">Вход для бухгалтера</button>
  </section>
  <form class="rolebox" id="roleBox" hidden novalidate>
    <input type="password" id="rolePass" placeholder="Пароль бухгалтера" autocomplete="off" aria-label="Пароль">
    <button type="submit" class="tubtn">Войти</button>
  </form>
  <p class="msg err" id="roleErr" hidden></p>
  <p class="roleline"><a class="linkbtn" href="help.html">Как пользоваться приложением</a></p>
</div>

<script src="config.js?v=2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
<script src="xlsx-book.js?v=7"></script>
<script src="app.js?v=11"></script>
</body>
</html>
